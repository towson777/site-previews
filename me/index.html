<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Don't count my visits</title>
<style>
:root{--bg:#f5f6f2;--ink:#1b2226;--muted:#55626a;--brand:#155e57;--good:#155e57;--warn:#b3541e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:440px;background:#fff;border:1px solid #d6ddd8;border-radius:20px;padding:28px}
h1{font-size:24px;line-height:1.2;margin:0 0 10px}
p{margin:0 0 14px;color:var(--muted)}
.status{font-weight:600;padding:12px 14px;border-radius:12px;margin:18px 0}
.status.off{background:#dcebe6;color:var(--good)}
.status.on{background:#fbe9df;color:var(--warn)}
button{font:600 16px/1 inherit;font-family:inherit;padding:14px 20px;border-radius:99px;border:0;background:var(--brand);color:#fff;cursor:pointer;width:100%}
button.secondary{background:none;color:var(--brand);border:1px solid var(--brand);margin-top:10px}
small{display:block;color:var(--muted);margin-top:16px;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Don't count my visits</h1>
  <p>Use this once on each browser and phone you use, so your own visits to <b id="host"></b> don't show up in your visitor stats.</p>
  <div class="status" id="status" role="status"></div>
  <button type="button" id="off">Don't count this browser</button>
  <button type="button" class="secondary" id="on">Start counting this browser again</button>
  <small>This only applies to this site in this browser. Clearing your browsing data turns it off, so come back here if that happens.</small>
</main>
<script>
(function(){
  var K = 'umami.disabled', s = document.getElementById('status');
  document.getElementById('host').textContent = location.hostname;
  function get(){ try { return localStorage.getItem(K) === '1'; } catch (e) { return null; } }
  function show(){
    var v = get();
    if (v === null) { s.className = 'status on'; s.textContent = "This browser is blocking storage (private mode?), so it can't be excluded."; return; }
    s.className = 'status ' + (v ? 'off' : 'on');
    s.textContent = v ? '✓ Your visits on this browser are not counted.' : 'Your visits on this browser are being counted.';
  }
  document.getElementById('off').onclick = function(){ try { localStorage.setItem(K, '1'); } catch (e) {} show(); };
  document.getElementById('on').onclick = function(){ try { localStorage.removeItem(K); } catch (e) {} show(); };
  show();
})();
</script>
</body>
</html>
